name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Runs both the Domain unit tests and the Api Testcontainers integration suite. The
      # latter needs a Docker daemon, which GitHub-hosted ubuntu-latest runners provide
      # out of the box — this is the environment the integration tests were designed for.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Build Docker image
        run: docker build -t aerolineaw-api .
